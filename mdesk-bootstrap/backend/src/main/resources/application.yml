spring:
  application:
    name: mdesk-api
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DBNAME:rustdesk}
    username: ${POSTGRES_USER:rustdesk}
    password: ${POSTGRES_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:replace-this-with-at-least-32-characters}
  access-token-expiration: 7200000
  refresh-token-expiration: 604800000

mdesk:
  token-effective-seconds: ${TOKEN_EFFECTIVE_SECONDS:7200}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
