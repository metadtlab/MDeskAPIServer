<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/static/favicon.ico">
    <title>MDesk - 원격 제어 솔루션</title>
    <link href="https://hangeul.pstatic.net/hangeul_static/css/nanum-square-neo.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2b58f0;
            --primary-hover: #1a44d1;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'NanumSquareNeo', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            box-shadow: var(--card-shadow);
            padding: 60px 50px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            color: #222;
            margin-bottom: 15px;
        }

        .subtitle {
            font-size: 18px;
            color: #666;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-hover) 100%);
            color: white;
            font-size: 20px;
            font-weight: 700;
            padding: 18px 40px;
            border-radius: 15px;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(43, 88, 240, 0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: none;
            cursor: pointer;
        }

        .download-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(43, 88, 240, 0.5);
        }

        .download-btn:active {
            transform: translateY(-2px);
        }

        .download-icon {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .info-text {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #eee;
            font-size: 14px;
            color: #999;
            line-height: 1.8;
        }

        .info-text a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        .info-text a:hover {
            text-decoration: underline;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .cert-no-input-wrap {
            width: 100%;
            max-width: 292px;
            text-align: left;
        }

        .cert-no-input-wrap label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
            padding-left: 18px;
        }

        .cert-no-input {
            width: 100%;
            padding: 14px 18px;
            font-size: 16px;
            font-family: 'NanumSquareNeo', sans-serif;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            outline: none;
            transition: border-color 0.3s;
        }

        .cert-no-input:focus {
            border-color: var(--primary-color);
        }

        .cert-no-input::placeholder {
            color: #aaa;
        }

        .download-btn.free {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
        }

        .download-btn.free:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(40, 167, 69, 0.4);
        }

        .download-btn.paid {
            background: linear-gradient(135deg, #fd7e14 0%, #e83e8c 100%);
        }

        .download-btn.paid:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(253, 126, 20, 0.4);
        }

        .btn-label {
            display: block;
            font-size: 12px;
            opacity: 0.9;
            margin-top: 2px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 30px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .subtitle {
                font-size: 16px;
            }
            
            .download-btn {
                font-size: 18px;
                padding: 15px 30px;
            }

            .btn-container {
                flex-direction: column;
                gap: 15px;
            }

            .cert-no-input-wrap {
                max-width: 100%;
            }
        }

        /* 다운로드 안내 애니메이션 */
        .download-guide {
            display: none;
            position: fixed;
            top: 20px;
            right: 80px;
            z-index: 9999;
            animation: bounceArrow 1s ease-in-out infinite;
        }

        .download-guide.show {
            display: block;
        }

        .download-guide-content {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #ff6b6b;
            color: white;
            padding: 15px 25px;
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(255, 107, 107, 0.5);
            font-weight: 700;
            font-size: 16px;
        }

        .download-guide-arrow {
            font-size: 28px;
            animation: pointRight 0.5s ease-in-out infinite alternate;
        }

        @keyframes bounceArrow {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes pointRight {
            from {
                transform: translateX(0);
            }
            to {
                transform: translateX(10px);
            }
        }

        .download-guide-close {
            position: absolute;
            top: -8px;
            left: -8px;
            width: 24px;
            height: 24px;
            background: #333;
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .download-guide-close:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="/static/layui/img/metaicon.png" alt="MDesk Logo" style="width: 120px; height: 120px; margin-bottom: 20px; border-radius: 20px;">
        <h1>MDesk 원격 제어</h1>
        <p class="subtitle">
            안전하고 빠른 원격 데스크톱 제어 솔루션<br>
            지금 바로 다운로드하여 시작하세요
        </p>
        <div class="btn-container">
            <div class="cert-no-input-wrap">
                <label for="certNoInput">인증번호</label>
                <input type="text" id="certNoInput" class="cert-no-input" placeholder="인증번호를 입력하세요" maxlength="10" autocomplete="off">
            </div>
            <a href="#" class="download-btn free" onclick="downloadFree(); return false;">
                <svg class="download-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                클라이언트 다운로드
            </a>
        </div>
        <div class="info-text">
            상담원이 불러준 "<strong style="color: var(--primary-color); font-weight: 700;">인증번호</strong>"를 입력하고
            "<strong style="color: var(--primary-color); font-weight: 700;">클라이언트 다운로드</strong>"를 실행해주세요.
        </div>
    </div>

    <!-- 다운로드 안내 -->
    <div class="download-guide" id="downloadGuide">
        <button class="download-guide-close" onclick="hideDownloadGuide()">✕</button>
        <div class="download-guide-content">
            <span>다운받은 파일을 클릭하세요!</span>
            <span class="download-guide-arrow">👆</span>
        </div>
    </div>

    <script>
        function downloadFree() {
            // MDesk 클라이언트 다운로드 (인증번호가 있으면 certnum 파라미터로 전달)
            var certnum = document.getElementById('certNoInput').value.trim();
            var url = '/api/download/mdesk';
            if (certnum) {
                url += '?certnum=' + encodeURIComponent(certnum);
            }
            window.location.href = url;
            
            // 다운로드 안내 표시 (1초 후)
            setTimeout(function() {
                document.getElementById('downloadGuide').classList.add('show');
            }, 1000);
            
            // 10초 후 자동 숨김
            setTimeout(function() {
                hideDownloadGuide();
            }, 10000);
        }
        
        function hideDownloadGuide() {
            document.getElementById('downloadGuide').classList.remove('show');
        }
    </script>
</body>
</html>
