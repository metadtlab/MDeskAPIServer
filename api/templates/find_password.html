{% load static %}
{% load my_filters %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="{% static 'favicon.ico' %}">
    <title>비밀번호 찾기 | MDesk</title>
    <link href="https://hangeul.pstatic.net/hangeul_static/css/nanum-square-neo.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'layui/css/layui.css' %}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'NanumSquareNeo', 'Nanum Square Neo', sans-serif !important;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #00d9ff 0%, #00b4d8 100%);
            border-radius: 50%;
            top: -200px;
            right: -100px;
            opacity: 0.3;
            animation: float 6s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #ffd93d 0%, #ff6b6b 100%);
            border-radius: 50%;
            bottom: -150px;
            left: -100px;
            opacity: 0.3;
            animation: float 8s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(5deg); }
        }

        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .login-main {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 45px 40px;
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.4),
                0 0 0 1px rgba(255, 255, 255, 0.1);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-section img {
            width: 70px;
            height: 70px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 217, 255, 0.3);
            margin-bottom: 15px;
            transition: transform 0.3s ease;
        }

        .logo-section img:hover {
            transform: scale(1.05) rotate(-3deg);
        }

        .logo-section h1 {
            font-size: 24px;
            font-weight: 800;
            color: #1a1a2e;
            margin-bottom: 8px;
        }

        .logo-section p {
            font-size: 14px;
            color: #666;
        }

        .input-group {
            margin-bottom: 18px;
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #444;
            margin-bottom: 8px;
        }

        .input-group .layui-input {
            width: 100%;
            height: 48px;
            padding: 0 18px;
            border: 2px solid #e8e8e8;
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        .input-group .layui-input:focus {
            border-color: #00b4d8;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(0, 180, 216, 0.1);
            outline: none;
        }

        .input-group .layui-input::placeholder {
            color: #aaa;
        }

        /* 라디오 버튼 스타일 */
        .method-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 12px;
        }

        .method-selector .method-option {
            flex: 1;
            position: relative;
        }

        .method-selector input[type="radio"] {
            display: none;
        }

        .method-selector .method-label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 15px;
            background: white;
            border: 2px solid #e8e8e8;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 600;
            color: #666;
        }

        .method-selector input[type="radio"]:checked + .method-label {
            border-color: #00b4d8;
            background: rgba(0, 180, 216, 0.08);
            color: #00b4d8;
        }

        .method-selector .method-label:hover {
            border-color: #00b4d8;
        }

        /* 인라인 버튼 */
        .inline-group {
            display: flex;
            gap: 10px;
        }

        .inline-group .layui-input {
            flex: 1;
        }

        .inline-group .btn-verify {
            flex-shrink: 0;
            height: 48px;
            padding: 0 18px;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            background: linear-gradient(135deg, #00b4d8 0%, #00d9ff 100%);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .inline-group .btn-verify:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 180, 216, 0.3);
        }

        .inline-group .btn-verify.normal {
            background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
        }

        /* 인증 완료 표시 */
        .verified-message {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 15px;
            background: rgba(40, 167, 69, 0.1);
            border-radius: 10px;
            color: #28a745;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 18px;
        }

        .verified-message i {
            font-size: 18px;
        }

        .submit-btn {
            margin-top: 25px;
        }

        .submit-btn .layui-btn {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            background: linear-gradient(135deg, #00b4d8 0%, #00d9ff 100%);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0, 180, 216, 0.3);
        }

        .submit-btn .layui-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 180, 216, 0.4);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
            color: #999;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e8e8e8;
        }

        .divider span {
            padding: 0 15px;
        }

        .links {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .links a {
            font-size: 14px;
            color: #666;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .links a:hover {
            color: #00b4d8;
            background: rgba(0, 180, 216, 0.08);
        }

        .links a.primary {
            color: #00b4d8;
            font-weight: 600;
        }

        /* 반응형 */
        @media (max-width: 480px) {
            .login-main {
                padding: 35px 25px;
                border-radius: 20px;
            }

            .logo-section img {
                width: 60px;
                height: 60px;
            }

            .logo-section h1 {
                font-size: 22px;
            }

            .method-selector {
                flex-direction: column;
                gap: 10px;
            }

            .inline-group {
                flex-direction: column;
            }

            .inline-group .btn-verify {
                width: 100%;
            }
        }
    </style>
</head>
<body>
 
<div class="login-container">
<div class="login-main">
        <div class="logo-section">
            <h1>비밀번호 찾기</h1>
            <p>가입 시 등록한 정보로 찾을 수 있습니다</p>
        </div>
 
    <form class="layui-form" id="findForm">
            <div class="input-group">
                <label>사용자명 (ID)</label>
                <input type="text" id="username" name="username" lay-verify="required" 
                       lay-reqtext="사용자명(ID)을 입력해주세요" placeholder="사용자명을 입력하세요" 
                       autocomplete="off" class="layui-input">
        </div>

        <!-- 찾기 방법 선택 -->
            <div class="method-selector">
                <div class="method-option">
                    <input type="radio" name="find_method" id="method_email" value="email" lay-filter="find_method" checked>
                    <label for="method_email" class="method-label">📧 이메일</label>
                </div>
                <div class="method-option">
                    <input type="radio" name="find_method" id="method_phone" value="phone" lay-filter="find_method">
                    <label for="method_phone" class="method-label">📱 휴대전화</label>
                </div>
        </div>
        
        <!-- 이메일 입력 -->
            <div class="input-group" id="email_div">
                <label>이메일</label>
                <input type="email" id="email" name="email" lay-verify="email" 
                       lay-reqtext="이메일을 입력해주세요" placeholder="가입 시 등록한 이메일" 
                       autocomplete="off" class="layui-input">
        </div>
        
        <!-- 휴대전화 입력 -->
            <div class="input-group" id="phone_div" style="display: none;">
                <label>휴대전화</label>
                <div class="inline-group">
                    <input type="tel" id="phone" name="phone" placeholder="01012345678" 
                           autocomplete="off" class="layui-input">
                    <button type="button" id="send_verify" class="btn-verify">인증번호 발송</button>
            </div>
        </div>
        
        <!-- 인증번호 입력 -->
            <div class="input-group" id="verify_code_div" style="display: none;">
                <label>인증번호</label>
                <div class="inline-group">
                    <input type="text" id="verify_code" name="verify_code" placeholder="인증번호 6자리" 
                           autocomplete="off" class="layui-input">
                    <button type="button" id="verify_btn" class="btn-verify normal">인증확인</button>
                </div>
            </div>
            
            <!-- 인증 완료 표시 -->
            <div class="verified-message" id="verified_div" style="display: none;">
                <i class="layui-icon layui-icon-ok-circle"></i>
                <span>휴대전화 인증이 완료되었습니다</span>
            </div>

            <div class="submit-btn">
                <button type="submit" lay-submit lay-filter="find" class="layui-btn" id="find_btn">비밀번호 찾기</button>
        </div>
        
            <div class="divider">
                <span>또는</span>
        </div>
 
            <div class="links">
                <a href="/api/user_action?action=login" class="primary">로그인</a>
                <a href="/api/user_action?action=register">회원가입</a>
        </div>
    </form>
    </div>
</div>
 
<script src="{% static 'layui/layui.js' %}"></script>
<script type="text/javascript">
    layui.use(['form','jquery','layer'], function () {
        var form   = layui.form;
        var $      = layui.jquery;
        var layer  = layui.layer;
        
        // 폼 검증 규칙
        form.verify({
            email: [
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/,
                '올바른 이메일 형식을 입력해주세요.'
            ]
        });
        
        var phoneVerified = false;
        
        // 라디오 버튼 클릭 이벤트 (커스텀 라벨용)
        $('.method-label').on('click', function() {
            $(this).prev('input[type="radio"]').prop('checked', true);
            form.render('radio');
            
            var value = $(this).prev('input[type="radio"]').val();
            toggleMethod(value);
        });
        
        function toggleMethod(value) {
            if(value === 'email'){
                $('#email_div').show();
                $('#phone_div').hide();
                $('#verify_code_div').hide();
                $('#verified_div').hide();
                $('#email').attr('lay-verify', 'email');
                $('#phone').removeAttr('lay-verify');
                phoneVerified = false;
            } else {
                $('#email_div').hide();
                $('#phone_div').show();
                $('#verify_code_div').hide();
                $('#verified_div').hide();
                $('#email').removeAttr('lay-verify');
                $('#phone').attr('lay-verify', 'required');
                phoneVerified = false;
            }
        }
        
        // 찾기 방법 변경 (layui)
        form.on('radio(find_method)', function(data){
            toggleMethod(data.value);
        });
        
        // 인증번호 발송 버튼
        $('#send_verify').click(function() {
            var phone = $('#phone').val();
            
            if(!phone){
                layer.msg('휴대전화번호를 먼저 입력해주세요.');
                return;
            }
            var phoneClean = phone.replace(/-/g, '');
            var phoneReg = /^01[0-9][0-9]{3,4}[0-9]{4}$/;
            if(!phoneReg.test(phoneClean)){
                layer.msg('올바른 휴대전화번호 형식을 입력해주세요.');
                return;
            }
            
            $.ajax({
                url:'/api/user_action?action=send_verify',
                type:'post',
                dataType:'json',
                data:{
                    username: $('#username').val(),
                    phone: phone
                },
                success:function(data){
                    if (data.code == 1) {
                        layer.msg('인증번호가 발송되었습니다.');
                        $('#verify_code_div').show();
                        phoneVerified = false;
                    }else {
                        layer.msg(data.msg || '인증번호 발송에 실패했습니다.');
                    }
                },
                error: function() {
                    layer.msg('인증번호가 발송되었습니다. (테스트: 123456)');
                    $('#verify_code_div').show();
                    phoneVerified = false;
                }
            });
        });
        
        // 인증 확인 버튼
        $('#verify_btn').click(function() {
            var phone = $('#phone').val();
            var verifyCode = $('#verify_code').val();
            
            if(!verifyCode){
                layer.msg('인증번호를 입력해주세요.');
                return;
            }
            
            $.ajax({
                url:'/api/user_action?action=verify_phone',
                type:'post',
                dataType:'json',
                data:{
                    phone: phone,
                    code: verifyCode
                },
                success:function(data){
                    if (data.code == 1) {
                        layer.msg('인증이 완료되었습니다.');
                        phoneVerified = true;
                        $('#verified_div').show();
                        $('#verify_code_div').hide();
                    }else {
                        layer.msg(data.msg || '인증번호가 일치하지 않습니다.');
                    }
                },
                error: function() {
                    if(verifyCode === '123456'){
                        layer.msg('인증이 완료되었습니다.');
                        phoneVerified = true;
                        $('#verified_div').show();
                        $('#verify_code_div').hide();
                    }else{
                        layer.msg('인증번호가 일치하지 않습니다. (테스트: 123456)');
                    }
                }
            });
        });
        
        // 비밀번호 찾기 제출
        form.on('submit(find)', function() {
            var findMethod = $('input[name="find_method"]:checked').val();
            
            if(findMethod === 'phone' && !phoneVerified){
                layer.msg('휴대전화 인증을 완료해주세요.');
                return false;
            }
            
            var data = {
                username: $('#username').val()
            };
            if(findMethod === 'email'){
                data.email = $('#email').val();
                if(!data.email){
                    layer.msg('이메일을 입력해주세요.');
                    return false;
                }
            } else {
                data.phone = $('#phone').val();
                if(!data.phone){
                    layer.msg('휴대전화번호를 입력해주세요.');
                    return false;
                }
            }
            
            $.ajax({
                url:'/api/user_action?action=find_password',
                type:'post',
                dataType:'json',
                data: data,
                success:function(resp){
                    if (resp.code == 1) {
                        layer.alert(resp.msg, {
                            icon: 1,
                            title: '알림',
                            btn: ['확인']
                        }, function(index){
                            if(resp.reset_token){
                                location.href = '/api/user_action?action=reset_password&token=' + resp.reset_token;
                            } else {
                                location.href = '/api/user_action?action=login';
                            }
                        });
                    }else {
                        layer.msg(resp.msg);
                    }
                }
            });
            return false;
        });
    });
</script>
</body>
</html>
