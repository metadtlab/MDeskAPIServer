{% load static %}
{% load my_filters %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="{% static 'favicon.ico' %}">
    <title>회원가입 | MDesk</title>
    <link href="https://hangeul.pstatic.net/hangeul_static/css/nanum-square-neo.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'layui/css/layui.css' %}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'NanumSquareNeo', 'Nanum Square Neo', sans-serif !important;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            position: relative;
            overflow-x: hidden;
            padding: 30px 0;
        }

        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
            border-radius: 50%;
            top: -200px;
            right: -100px;
            opacity: 0.3;
            animation: float 6s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #00cec9 0%, #55a3ff 100%);
            border-radius: 50%;
            bottom: -150px;
            left: -100px;
            opacity: 0.3;
            animation: float 8s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(5deg); }
        }

        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 460px;
            padding: 20px;
        }

        .login-main {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px 35px;
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.4),
                0 0 0 1px rgba(255, 255, 255, 0.1);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-section img {
            width: 70px;
            height: 70px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(108, 92, 231, 0.3);
            margin-bottom: 15px;
            transition: transform 0.3s ease;
        }

        .logo-section img:hover {
            transform: scale(1.05) rotate(-3deg);
        }

        .logo-section h1 {
            font-size: 26px;
            font-weight: 800;
            color: #1a1a2e;
            margin-bottom: 8px;
        }

        .logo-section p {
            font-size: 14px;
            color: #666;
        }

        .input-group {
            margin-bottom: 16px;
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #444;
            margin-bottom: 6px;
        }

        .input-group .layui-input {
            width: 100%;
            height: 46px;
            padding: 0 16px;
            border: 2px solid #e8e8e8;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        .input-group .layui-input:focus {
            border-color: #6c5ce7;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.1);
            outline: none;
        }

        .input-group .layui-input::placeholder {
            color: #aaa;
        }

        .input-group.has-icon {
            position: relative;
        }

        .input-group.has-icon .layui-input {
            padding-right: 40px;
        }

        .input-group .status-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            margin-top: 12px;
        }

        .input-group .status-icon.success {
            color: #28a745;
        }

        .input-group .status-icon.error {
            color: #dc3545;
        }

        /* 인라인 버튼 */
        .inline-group {
            display: flex;
            gap: 10px;
        }

        .inline-group .layui-input {
            flex: 1;
        }

        .inline-group .btn-verify {
            flex-shrink: 0;
            height: 46px;
            padding: 0 16px;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .inline-group .btn-verify:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.3);
        }

        .inline-group .btn-verify.normal {
            background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
        }

        /* 안내 문구 */
        .info-message {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: rgba(108, 92, 231, 0.08);
            border-radius: 8px;
            color: #6c5ce7;
            font-size: 13px;
            margin-bottom: 16px;
        }

        /* 인증 완료 표시 */
        .verified-message {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 14px;
            background: rgba(40, 167, 69, 0.1);
            border-radius: 10px;
            color: #28a745;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .verified-message i {
            font-size: 18px;
        }

        .submit-btn {
            margin-top: 25px;
        }

        .submit-btn .layui-btn {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(108, 92, 231, 0.3);
        }

        .submit-btn .layui-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(108, 92, 231, 0.4);
        }

        .submit-btn .layui-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
            color: #999;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e8e8e8;
        }

        .divider span {
            padding: 0 15px;
        }

        .links {
            text-align: center;
        }

        .links a {
            font-size: 14px;
            color: #6c5ce7;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .links a:hover {
            text-decoration: underline;
        }

        /* 반응형 */
        @media (max-width: 480px) {
            .login-main {
                padding: 35px 25px;
                border-radius: 20px;
            }

            .logo-section img {
                width: 60px;
                height: 60px;
            }

            .logo-section h1 {
                font-size: 22px;
            }

            .inline-group {
                flex-direction: column;
            }

            .inline-group .btn-verify {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-main">
        <div class="logo-section">
            <h1>회원가입</h1>
            <p>MDesk 서비스에 가입하세요</p>
        </div>
        
        <form class="layui-form">
            <!-- 사용자명 -->
            <div class="input-group has-icon">
                <label>사용자명 (ID) <span style="color: #dc3545;">*</span></label>
                <input type="text" id="user" name="account" required lay-verify="required" 
                       lay-reqtext="사용자명을 입력해주세요" placeholder="영문, 숫자 조합" 
                       autocomplete="off" class="layui-input">
                <i class="layui-icon status-icon success" id="ri" style="display:none;"></i>
                <i class="layui-icon status-icon error" id="wr" style="display:none;">ဆ</i>
            </div>
            
            <!-- 비밀번호 -->
            <div class="input-group has-icon">
                <label>비밀번호 <span style="color: #dc3545;">*</span></label>
                <input type="password" id="pwd" name="password" required lay-verify="required" 
                       lay-reqtext="비밀번호를 입력해주세요" placeholder="8~20자리" 
                       autocomplete="off" class="layui-input">
                <i class="layui-icon status-icon success" id="pri" style="display:none;"></i>
                <i class="layui-icon status-icon error" id="pwr" style="display:none;">ဆ</i>
            </div>
            
            <!-- 비밀번호 확인 -->
            <div class="input-group has-icon">
                <label>비밀번호 확인 <span style="color: #dc3545;">*</span></label>
                <input type="password" id="rpwd" name="repassword" required lay-verify="required" 
                       lay-reqtext="비밀번호를 다시 입력해주세요" placeholder="비밀번호 재입력" 
                       autocomplete="off" class="layui-input">
                <i class="layui-icon status-icon success" id="rpri" style="display:none;"></i>
                <i class="layui-icon status-icon error" id="rpwr" style="display:none;">ဆ</i>
            </div>
            
            <!-- 회사명 -->
            <div class="input-group">
                <label>회사명</label>
                <input type="text" id="company" name="company" placeholder="선택사항" 
                       autocomplete="off" class="layui-input">
            </div>
            
            <!-- 이메일 -->
            <div class="input-group has-icon">
                <label>이메일</label>
                <input type="email" id="email" name="email" lay-verify="email" 
                       lay-reqtext="올바른 이메일을 입력해주세요" placeholder="example@email.com" 
                       autocomplete="off" class="layui-input">
                <i class="layui-icon status-icon success" id="eri" style="display:none;"></i>
                <i class="layui-icon status-icon error" id="ewr" style="display:none;">ဆ</i>
            </div>
            
            <!-- 휴대전화 -->
            <div class="input-group">
                <label>휴대전화</label>
                <div class="inline-group">
                    <input type="tel" id="phone" name="phone" placeholder="01012345678" 
                           autocomplete="off" class="layui-input">
                    <button type="button" id="send_verify" class="btn-verify">인증번호 발송</button>
                </div>
            </div>
            
            <!-- 안내 문구 -->
            <div class="info-message">
                <i class="layui-icon layui-icon-tips"></i>
                <span>유료사용자는 카카오톡 알림톡 인증이 필요합니다!</span>
            </div>
            
            <!-- 인증번호 입력 -->
            <div class="input-group" id="verify_code_div" style="display: none;">
                <label>인증번호</label>
                <div class="inline-group">
                    <input type="text" id="verify_code" name="verify_code" placeholder="인증번호 6자리" 
                           autocomplete="off" class="layui-input">
                    <button type="button" id="verify_btn" class="btn-verify normal">인증확인</button>
                </div>
            </div>
            
            <!-- 인증 완료 표시 -->
            <div class="verified-message" id="verified_div" style="display: none;">
                <i class="layui-icon layui-icon-ok-circle"></i>
                <span>휴대전화 인증이 완료되었습니다</span>
            </div>

            <div class="submit-btn">
                <button type="submit" lay-submit lay-filter="sub" class="layui-btn" id="submit_btn" disabled>회원가입</button>
            </div>
            
            <div class="divider">
                <span>이미 계정이 있으신가요?</span>
            </div>
            
            <div class="links">
                <a href="/api/user_action?action=login">로그인하기</a>
            </div>
        </form>
    </div>
</div>

<script src="{% static 'layui/layui.js' %}"></script>
<script type="text/javascript">
    layui.use(['form','jquery','layer'], function () {
        var form   = layui.form;
        var $      = layui.jquery;
        var layer  = layui.layer;

        // 폼 검증 규칙
        form.verify({
            email: [
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/,
                '올바른 이메일 형식을 입력해주세요.'
            ]
        });

        layui.layer.config({
            anim: 0,
            btn: ['확인'],
            title: '알림'
        });

        // 비밀번호 정규식 검증
        $('#pwd').blur(function() {
            var reg = /^[\w\S]{8,20}$/;
            if(!($('#pwd').val().match(reg))){
                $('#pwr').show();
                $('#pri').hide();
                layer.msg('8~20자리 비밀번호를 입력하세요.');
            }else {
                $('#pri').show();
                $('#pwr').hide();
            }
        });

        // 비밀번호 일치 검증
        $('#rpwd').blur(function() {
            if($('#pwd').val() != $('#rpwd').val()){
                $('#rpwr').show();
                $('#rpri').hide();
                layer.msg('비밀번호가 일치하지 않습니다!');
            }else {
                $('#rpri').show();
                $('#rpwr').hide();
            }
        });

        // 이메일 유효성 검사
        $('#email').blur(function() {
            var email = $(this).val();
            var emailReg = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if(email && !emailReg.test(email)){
                $('#ewr').show();
                $('#eri').hide();
                layer.msg('올바른 이메일 형식을 입력해주세요.');
            }else if(email){
                $('#eri').show();
                $('#ewr').hide();
            }
        });

        // 휴대전화 번호 유효성 검사
        $('#phone').blur(function() {
            var phone = $(this).val();
            var phoneClean = phone.replace(/-/g, '');
            var phoneReg = /^01[0-9][0-9]{3,4}[0-9]{4}$/;
            if(phone && !phoneReg.test(phoneClean)){
                layer.msg('올바른 휴대전화번호 형식을 입력해주세요.');
            }
        });

        // 인증번호 발송
        var phoneVerified = false;
        $('#send_verify').click(function() {
            var phone = $('#phone').val();
            
            if(!phone){
                layer.msg('휴대전화번호를 먼저 입력해주세요.');
                return;
            }
            var phoneClean = phone.replace(/-/g, '');
            var phoneReg = /^01[0-9][0-9]{3,4}[0-9]{4}$/;
            if(!phoneReg.test(phoneClean)){
                layer.msg('올바른 휴대전화번호 형식을 입력해주세요.');
                return;
            }
            
            // 먼저 전화번호 중복 확인
            $.ajax({
                url:'/api/user_action?action=check_phone',
                type:'post',
                dataType:'json',
                data:{ phone: phone },
                success:function(data){
                    if (data.code == 0) {
                        // 이미 등록된 번호
                        layer.msg(data.msg || '이미 등록된 전화번호입니다.');
                        return;
                    }
                    // 중복이 아니면 인증번호 발송
                    sendVerifyCode(phone);
                },
                error: function() {
                    // 에러 시에도 인증번호 발송 진행 (테스트용)
                    sendVerifyCode(phone);
                }
            });
        });
        
        // 인증번호 발송 함수
        function sendVerifyCode(phone) {
            $.ajax({
                url:'/api/user_action?action=send_verify',
                type:'post',
                dataType:'json',
                data:{ phone: phone },
                success:function(data){
                    if (data.code == 1) {
                        layer.msg(data.msg || '인증번호가 발송되었습니다.');
                        $('#verify_code_div').show();
                        phoneVerified = false;
                        $('#submit_btn').prop('disabled', true);
                    }else {
                        layer.msg(data.msg || '인증번호 발송에 실패했습니다.');
                    }
                },
                error: function() {
                    layer.msg('인증번호가 발송되었습니다. (테스트: 123456)');
                    $('#verify_code_div').show();
                    phoneVerified = false;
                    $('#submit_btn').prop('disabled', true);
                }
            });
        }

        // 인증 확인
        $('#verify_btn').click(function() {
            var phone = $('#phone').val();
            var verifyCode = $('#verify_code').val();
            
            if(!verifyCode){
                layer.msg('인증번호를 입력해주세요.');
                return;
            }
            
            $.ajax({
                url:'/api/user_action?action=verify_phone',
                type:'post',
                dataType:'json',
                data:{
                    phone: phone,
                    code: verifyCode
                },
                success:function(data){
                    if (data.code == 1) {
                        layer.msg('인증이 완료되었습니다.');
                        phoneVerified = true;
                        $('#phone').prop('readonly', true).css({'background-color': '#f2f2f2', 'cursor': 'not-allowed'});
                        $('#verified_div').show();
                        $('#verify_code_div').hide();
                        $('#submit_btn').prop('disabled', false);
                    }else {
                        layer.msg(data.msg || '인증번호가 일치하지 않습니다.');
                    }
                },
                error: function() {
                    if(verifyCode === '123456'){
                        layer.msg('인증이 완료되었습니다.');
                        phoneVerified = true;
                        $('#phone').prop('readonly', true).css({'background-color': '#f2f2f2', 'cursor': 'not-allowed'});
                        $('#verified_div').show();
                        $('#verify_code_div').hide();
                        $('#submit_btn').prop('disabled', false);
                    }else{
                        layer.msg('인증번호가 일치하지 않습니다. (테스트: 123456)');
                    }
                }
            });
        });

        // 폼 제출
        form.on('submit(sub)', function() {
            var phone = $('#phone').val();
            if(phone){
                var phoneClean = phone.replace(/-/g, '');
                var phoneReg = /^01[0-9][0-9]{3,4}[0-9]{4}$/;
                if(!phoneReg.test(phoneClean)){
                    layer.msg('올바른 휴대전화번호 형식을 입력해주세요.');
                    return false;
                }
            }
            
            if(!phoneVerified && $('#phone').val()){
                layer.msg('휴대전화 인증을 완료해주세요.');
                return false;
            }
            
            $.ajax({
                url:'/api/user_action?action=register',
                type:'post',
                dataType:'json',
                data:{
                    user:$('#user').val(),
                    pwd:$('#pwd').val(),
                    company:$('#company').val(),
                    email:$('#email').val(),
                    phone:$('#phone').val(),
                    phone_verified:phoneVerified ? '1' : '0'
                },
                success:function(data){
                    if (data.code == 1) {
                        layer.msg('회원가입 성공! 로그인 페이지에서 로그인하세요.');
                        setTimeout(function(){
                            location.href = '/api/user_action?action=login';
                        }, 1500);
                    }else {
                        layer.msg(data.msg);
                    }
                }
            });
            return false;
        });
    });
</script>
</body>
</html>
